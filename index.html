<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis finanzas</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>

<dialog id="editor-movimiento" aria-labelledby="titulo-editor">
  <h2 id="titulo-editor">Editar movimiento</h2>

  <form id="formulario-editar">
    <label for="editar-tipo">Tipo</label>
    <select id="editar-tipo">
      <option value="gasto">Gasto</option>
      <option value="ingreso">Ingreso</option>
    </select>

    <label for="editar-descripcion">Descripción</label>
    <input
      id="editar-descripcion"
      type="text"
      maxlength="100"
      required
    >

    <label for="editar-valor">Valor en pesos colombianos</label>
    <input
      id="editar-valor"
      type="number"
      min="1"
      max="1000000000000"
      step="1"
      inputmode="numeric"
      required
    >

    <button type="submit">Guardar cambios</button>

    <button id="cancelar-edicion" class="boton-cancelar" type="button">
      Cancelar
    </button>
  </form>
</dialog>

<body>
  <main>
    <header>
      <h1>Mis finanzas</h1>
      <p>Un lugar para organizar mi dinero.</p>
    </header>

    <section class="resumen" aria-label="Resumen financiero">
      <article>
        <h2>Ingresos</h2>
        <p id="total-ingresos">$0</p>
      </article>

      <article>
        <h2>Gastos</h2>
        <p id="total-gastos">$0</p>
      </article>

      <article>
        <h2>Saldo</h2>
        <p id="saldo">$0</p>
      </article>
    </section>

    <section class="panel">
      <h2>Nuevo movimiento</h2>

      <form id="formulario">
        <label for="tipo">Tipo de movimiento</label>
        <select id="tipo">
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
        </select>

        <label for="descripcion">Descripción</label>
        <input
          id="descripcion"
          type="text"
          placeholder="Ejemplo: mercado o sueldo"
          maxlength="100"
          required
        >

        <label for="valor">Valor en pesos colombianos</label>
        <input
          id="valor"
          type="number"
          placeholder="Ejemplo: 25000"
          min="1"
          max="1000000000000"
          step="1"
          inputmode="numeric"
          required
        >

        <button type="submit">Agregar movimiento</button>
      </form>
    </section>

    <section class="panel">
      <h2>Mis movimientos</h2>
      <p id="sin-movimientos">Todavía no has registrado movimientos.</p>
      <ul id="lista-movimientos"></ul>
    </section>
    <section class="menu-copia">
  <button
    id="abrir-menu-copia"
    type="button"
    aria-label="Opciones de copia de seguridad"
    aria-expanded="false"
    aria-controls="opciones-copia"
    title="Copia de seguridad"
  >
    <span aria-hidden="true">💾</span>
  </button>

  <div id="opciones-copia" class="opciones-copia" hidden>
    <button id="exportar" type="button">
      Guardar copia
    </button>

    <button id="importar" type="button">
      Restaurar copia
    </button>
  </div>

  <input
    id="archivo-copia"
    type="file"
    accept=".json,application/json"
    hidden
  >
</section>
  </main>
</body>
</html>
